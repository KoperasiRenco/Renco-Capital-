name: Build APK

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Clone pwa2apk
        run: |
          git clone https://github.com/Tonihj77-T/pwa2apk.git
          cd pwa2apk
          npm install

      - name: Build APK
        run: |
          node pwa2apk/bin/pwa2apk.js \
            --url https://koperasirenco.github.io/Renco-Capital \
            --name "Renco Capital" \
            --package com.renco.capital \
            --output ./dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ./dist/*.apk
